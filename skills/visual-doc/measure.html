<!-- measure.html (SHARED: identical in eli5, explain-diff, micro-world, visual-doc)
     Append this file to a COPY of the finished page in a scratch directory of your own (D, e.g.
     /tmp/<skill>-<slug>; never a shared fixed path, other runs may be writing there) and read the result
     in one line (use chromium if google-chrome is not installed):
       cat <page.html> <this file> > D/measure.html && google-chrome --headless=new --no-sandbox --virtual-time-budget=10000 --window-size=1300,2000 --dump-dom "file://D/measure.html" | grep -o '<body[^>]*>'
     The <body> tag must carry all three of data-sbs, data-fit, data-ovf; if it carries none, the script did
     not run before the dump (raise --virtual-time-budget), which is a failed check, not a pass.
     Run it again with --window-size=500,2000 (headless Chrome does not go narrower than 500px).
     For a page whose content changes as the reader presses the right arrow (micro-world), add #steps=N
     to the URL to press it N times before measuring; measure the start, the middle, and the last step.
     data-sbs: every multi-column grid with something scrolling sideways inside it ("<grid class> xN"), or none.
     data-fit: every figure label (number badges excluded) that leaves its viewBox, crosses a box edge,
               or overlaps another label, measured with the rendered font, or none.
     data-ovf: content that spills out of (or is clipped by) a box with a border or background, outside
               any sideways-scrolling area ("<box> spills|clips <child> xN"), and a page wider than the
               viewport, or none.
     Never ship this script inside the page. -->
<script>addEventListener('load',()=>{const N=+(location.hash.match(/steps=(\d+)/)||[0,0])[1];let i=0;const go=()=>{if(i++<N){document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));setTimeout(go,120)}else setTimeout(run,300)};go()});function run(){const g=new Map(),f=[];for(const e of document.querySelectorAll('body *')){if(e.scrollWidth<=e.clientWidth+1)continue;for(let a=e.parentElement;a&&a!==document.body;a=a.parentElement){const s=getComputedStyle(a);if(s.display.endsWith('grid')&&s.gridTemplateColumns.trim().split(/\s+/).length>1){const k=a.className||a.tagName;g.set(k,(g.get(k)||0)+1);break}}}document.querySelectorAll('svg[viewBox]').forEach((v,n)=>{const[,,W,H]=v.getAttribute('viewBox').split(/[ ,]+/).map(Number),I=v.getScreenCTM().inverse(),B=e=>{const b=e.getBBox(),m=I.multiply(e.getScreenCTM()),p=[[b.x,b.y],[b.x+b.width,b.y+b.height]].map(([x,y])=>new DOMPoint(x,y).matrixTransform(m));return{x:p[0].x,y:p[0].y,r:p[1].x,b:p[1].y}},T=[...v.querySelectorAll('text')].filter(t=>!t.closest('.dg-m')).map(t=>[t,B(t)]),R=[...v.querySelectorAll('rect')].map(B),X=(a,c)=>a.x<c.r&&c.x<a.r&&a.y<c.b&&c.y<a.b,C=(o,i)=>o.x<=i.x+.5&&o.y<=i.y+.5&&o.r>=i.r-.5&&o.b>=i.b-.5;for(const[t,b]of T){const s='fig'+(n+1)+' "'+t.textContent.trim().slice(0,24)+'" ';if(b.x<0||b.y<0||b.r>W||b.b>H)f.push(s+'outside viewBox');if(R.some(r=>X(r,b)&&!C(r,b)))f.push(s+'crosses a box edge');for(const[u,c]of T)if(u!==t&&t.compareDocumentPosition(u)&4&&X(b,c))f.push(s+'overlaps "'+u.textContent.trim().slice(0,24)+'"')}});const O=new Map(),bx=a=>{const s=getComputedStyle(a);return parseFloat(s.borderLeftWidth)>0||parseFloat(s.borderRightWidth)>0||!/rgba\(0, 0, 0, 0\)|transparent/.test(s.backgroundColor)};for(const e of document.querySelectorAll('body *')){const r=e.getBoundingClientRect();if(!r.width||e.closest('svg')&&e.tagName!=='svg')continue;let p=getComputedStyle(e).position;if(p==='absolute'||p==='fixed')continue;for(let a=e.parentElement;a&&a!==document.body;a=a.parentElement){const s=getComputedStyle(a);if(s.position==='absolute'||s.position==='fixed')break;if(/auto|scroll/.test(s.overflowX))break;if(bx(a)){const q=a.getBoundingClientRect();if(r.right>q.right+1||r.left<q.left-1){const k=(a.className||a.tagName)+(/hidden|clip/.test(s.overflowX)?' clips ':' spills ')+(e.className||e.tagName);O.set(k,(O.get(k)||0)+1)}break}}}const W=document.documentElement;if(W.scrollWidth>W.clientWidth+1)O.set('page wider than viewport by '+(W.scrollWidth-W.clientWidth)+'px',1);document.body.dataset.ovf=[...O].map(([k,v])=>k+' x'+v).join(' | ')||'none';document.body.dataset.sbs=[...g].map(([k,v])=>k+' x'+v).join(' | ')||'none';document.body.dataset.fit=f.join(' | ')||'none'}</script>
