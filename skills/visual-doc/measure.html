<!-- measure.html (SHARED: identical in eli5, explain-diff, micro-world, visual-doc)
     Append this file to a COPY of the finished page and read the result in one line
     (use chromium if google-chrome is not installed):
       cat <page.html> <this file> > /tmp/measure-copy.html && google-chrome --headless=new --no-sandbox --dump-dom "file:///tmp/measure-copy.html" | grep -o 'data-\(sbs\|fit\)="[^"]*"'
     data-sbs: every multi-column grid with something scrolling sideways inside it ("<grid class> xN"), or none.
     data-fit: every figure label (number badges excluded) that leaves its viewBox, crosses a box edge,
               or overlaps another label, measured with the rendered font, or none.
     Never ship this script inside the page. -->
<script>addEventListener('load',()=>{const g=new Map(),f=[];for(const e of document.querySelectorAll('body *')){if(e.scrollWidth<=e.clientWidth+1)continue;for(let a=e.parentElement;a&&a!==document.body;a=a.parentElement){const s=getComputedStyle(a);if(s.display.endsWith('grid')&&s.gridTemplateColumns.trim().split(/\s+/).length>1){const k=a.className||a.tagName;g.set(k,(g.get(k)||0)+1);break}}}document.querySelectorAll('svg[viewBox]').forEach((v,n)=>{const[,,W,H]=v.getAttribute('viewBox').split(/[ ,]+/).map(Number),I=v.getScreenCTM().inverse(),B=e=>{const b=e.getBBox(),m=I.multiply(e.getScreenCTM()),p=[[b.x,b.y],[b.x+b.width,b.y+b.height]].map(([x,y])=>new DOMPoint(x,y).matrixTransform(m));return{x:p[0].x,y:p[0].y,r:p[1].x,b:p[1].y}},T=[...v.querySelectorAll('text')].filter(t=>!t.closest('.dg-m')).map(t=>[t,B(t)]),R=[...v.querySelectorAll('rect')].map(B),X=(a,c)=>a.x<c.r&&c.x<a.r&&a.y<c.b&&c.y<a.b,C=(o,i)=>o.x<=i.x+.5&&o.y<=i.y+.5&&o.r>=i.r-.5&&o.b>=i.b-.5;for(const[t,b]of T){const s='fig'+(n+1)+' "'+t.textContent.trim().slice(0,24)+'" ';if(b.x<0||b.y<0||b.r>W||b.b>H)f.push(s+'outside viewBox');if(R.some(r=>X(r,b)&&!C(r,b)))f.push(s+'crosses a box edge');for(const[u,c]of T)if(u!==t&&t.compareDocumentPosition(u)&4&&X(b,c))f.push(s+'overlaps "'+u.textContent.trim().slice(0,24)+'"')}});document.body.dataset.sbs=[...g].map(([k,v])=>k+' x'+v).join(' | ')||'none';document.body.dataset.fit=f.join(' | ')||'none'})</script>
